name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Vercel CLI
        run: npm install --global vercel@62.1.0
      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Ensure invitation publishing storage
        run: |
          if ! grep -q '^BLOB_READ_WRITE_TOKEN=' .vercel/.env.production.local; then
            vercel blob create-store nukrimegi-content --access private --yes --environment production --token="$VERCEL_TOKEN" > /tmp/blob-setup.log 2>&1 || { echo "Blob setup failed; check project storage permissions."; exit 1; }
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          fi
      - name: Install and test
        run: |
          npm ci
          node --test tests/*.test.cjs
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
